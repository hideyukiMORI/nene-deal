openapi: 3.0.3

# NeNe Deal — public JSON API (SSOT).
#
# Binding references:
#   - docs/explanation/scope-contract.md   (what Deal does / does not own)
#   - docs/explanation/terminology.md       (identifiers — MUST match)
#   - docs/explanation/domain-model.md       (entities)
#   - docs/integrations/invoice-handoff-contract.md (won -> Invoice handoff)
#   - docs/inheritance-from-nene2.md         (Problem Details base URL)
#
# Conventions:
#   - Amounts are integer minor units (JPY cents). No floats. (terminology.md)
#   - Resource ids are ULID strings unless noted. Invoice link ids are integers.
#   - organization_id (tenant) is derived from the authenticated principal,
#     never taken from the request path/body. (scope-contract D8)
#   - Errors use RFC 7807 Problem Details; type = https://nene-deal.dev/problems/{slug}
#   - UI display strings are localized client-side (ja/en) from stable slugs;
#     `label` fields are server defaults only. (ADR 0004, coding-standards i18n)

info:
  title: NeNe Deal API
  version: 0.1.0
  description: |
    Ultra-light B2B deal pipeline: deals, pipeline stages, kanban board,
    monthly forecast, and an operator-confirmed handoff that creates a
    **draft** client + quote in NeNe Invoice.

    Deal is the **pipeline SSOT**, not the billing SSOT. It stores Invoice
    **link ids only** after handoff and never duplicates quote/invoice/tax
    schemas. Reconciliation and dunning belong to NeNe Clear and are absent
    from this contract by design.
  license:
    name: MIT
    url: https://github.com/hideyukiMORI/nene-deal/blob/main/LICENSE

servers:
  - url: /api/v1
    description: Versioned API base (relative to deployment host)

security:
  - bearerAuth: []

tags:
  - name: Deals
    description: Deal cards — CRUD, stage move, audit, invoice handoff
  - name: Pipeline
    description: Stages, kanban board, forecast (read models)

paths:
  /deals:
    get:
      tags: [Deals]
      summary: List deals
      description: |
        Lists deals for the authenticated organization. Open deals only by
        default; pass `include_terminal=true` to include won/lost.
      operationId: listDeals
      parameters:
        - name: stage_id
          in: query
          description: Filter by current stage (ULID or slug).
          schema:
            type: string
        - name: owner_user_id
          in: query
          description: Filter by deal owner.
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive substring match on account_label.
          schema:
            type: string
        - name: include_terminal
          in: query
          description: Include deals in terminal stages (won/lost).
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of deals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Deals]
      summary: Create a deal
      operationId: createDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealCreate'
      responses:
        '201':
          description: Deal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /deals/{dealId}:
    parameters:
      - $ref: '#/components/parameters/DealId'
    get:
      tags: [Deals]
      summary: Get a deal
      operationId: getDeal
      responses:
        '200':
          description: The deal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Deals]
      summary: Update a deal
      description: |
        Partial update. **Stage is not changed here** — use
        `POST /deals/{dealId}/stage-change` so the move is audited.
        Invoice link ids are read-only and set only by handoff.
      operationId: updateDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealUpdate'
      responses:
        '200':
          description: Updated deal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Deals]
      summary: Delete a deal
      operationId: deleteDeal
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deals/{dealId}/stage-change:
    parameters:
      - $ref: '#/components/parameters/DealId'
    post:
      tags: [Deals]
      summary: Move a deal to another stage
      description: |
        Moves the deal to `to_stage_id` and records a DealStageHistory entry
        (actor derived from auth). Moving into a terminal **won** stage does
        **not** auto-trigger the Invoice handoff — that is a separate, explicit
        operator action. (scope-contract X9)
      operationId: changeDealStage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageChangeRequest'
      responses:
        '200':
          description: Deal after the move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /deals/{dealId}/history:
    parameters:
      - $ref: '#/components/parameters/DealId'
    get:
      tags: [Deals]
      summary: List stage-change history for a deal
      description: Audit-lite stage history, newest first. (scope-contract D7)
      operationId: listDealStageHistory
      responses:
        '200':
          description: Stage-change history entries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageHistoryEntry'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deals/{dealId}/invoice-handoff:
    parameters:
      - $ref: '#/components/parameters/DealId'
    post:
      tags: [Deals]
      summary: Hand off a won deal to NeNe Invoice (draft client + quote)
      description: |
        Operator-confirmed handoff. Deal calls NeNe Invoice over HTTP to create
        a **draft** client and a **draft** quote, then persists
        `invoice_client_id` and `invoice_quote_id` (link ids only).

        **Preconditions** (invoice-handoff-contract.md): deal is in the terminal
        won stage, has `account_label` and `amount_cents`, and is not already
        linked.

        **Idempotency**: send an `Idempotency-Key` header to make retries safe.
        A repeat on an already-linked deal returns `409` with the existing link
        unless the same key is replayed, which returns the original `200`.

        Upstream Invoice failures leave the deal **won but unlinked**; no partial
        link is written. Invoice remains billing SSOT after handoff.
      operationId: invoiceHandoff
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceHandoffRequest'
      responses:
        '200':
          description: Handoff completed; deal now linked to Invoice draft resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceHandoffResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Deal already linked to Invoice, or not eligible (e.g. not in won
            stage). Problem Details carries guidance and any existing link ids.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyLinked:
                  value:
                    type: https://nene-deal.dev/problems/invoice-handoff-already-linked
                    title: Deal already handed off
                    status: 409
                    detail: This deal is already linked to an Invoice quote.
                    invoice_client_id: 4821
                    invoice_quote_id: 9930
        '422':
          description: Preconditions not met (missing amount/account_label, or not won).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: NeNe Invoice returned an error or was unreachable; deal left unlinked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /stages:
    get:
      tags: [Pipeline]
      summary: List pipeline stages
      description: |
        Ordered pipeline stages for the organization (kanban column order).
        Seeded defaults: lead, qualified, proposal, negotiation, won, lost.
        Stage customization UI is Phase 2. (terminology.md, roadmap.md)
      operationId: listStages
      responses:
        '200':
          description: Ordered stages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PipelineStage'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /board:
    get:
      tags: [Pipeline]
      summary: Kanban board (stages with their open deals)
      description: |
        Read model for the kanban view: one column per stage with its open
        deals and per-column totals. Terminal stages are excluded unless
        `include_terminal=true`.
      operationId: getBoard
      parameters:
        - name: owner_user_id
          in: query
          description: Limit cards to a single owner.
          schema:
            type: string
        - name: include_terminal
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Kanban board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanbanBoard'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /forecast:
    get:
      tags: [Pipeline]
      summary: Monthly weighted forecast (approximate)
      description: |
        Weighted landing for a calendar month: open deals whose
        `expected_close_date` falls in the month, summed as
        `amount_cents * probability_percent / 100`. Approximate — not a
        billing or revenue figure. (scope-contract D4, terminology.md)
      operationId: getForecast
      parameters:
        - name: month
          in: query
          required: true
          description: Target calendar month, `YYYY-MM`.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-06'
      responses:
        '200':
          description: Forecast summary for the month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Operator/service token; organization scope is derived from it.

  parameters:
    DealId:
      name: dealId
      in: path
      required: true
      description: Deal ULID.
      schema:
        $ref: '#/components/schemas/Ulid'
    Limit:
      name: limit
      in: query
      description: Max items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key making the handoff retry-safe.
      schema:
        type: string
        maxLength: 255

  responses:
    BadRequest:
      description: Malformed request (e.g. bad query parameter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found in this organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Ulid:
      type: string
      description: ULID identifier (Crockford base32, 26 chars).
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      example: 01ARZ3NDEKTSV4RRFFQ69G5FAV

    AmountCents:
      type: integer
      format: int64
      minimum: 0
      description: Amount in JPY minor units (cents). No floats.
      example: 150000000

    Deal:
      type: object
      required:
        - id
        - organization_id
        - account_label
        - amount_cents
        - stage_id
        - probability_percent
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        organization_id:
          type: string
          readOnly: true
          description: Tenant scope; derived from the authenticated principal.
        account_label:
          type: string
          maxLength: 255
          description: Buyer display name until an Invoice client exists.
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        stage_id:
          $ref: '#/components/schemas/Ulid'
        stage_slug:
          type: string
          readOnly: true
          description: Convenience copy of the current stage slug.
        probability_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Win likelihood (0–100).
        expected_close_date:
          type: string
          format: date
          nullable: true
          description: Optional forecast hint.
        owner_user_id:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 2000
          description: Short note; not a CRM activity feed.
        invoice_client_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
          description: NeNe Invoice client PK; set only after handoff.
        invoice_quote_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
          description: NeNe Invoice quote PK; set only after handoff.
        handoff_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    DealCreate:
      type: object
      required:
        - account_label
        - amount_cents
        - stage_id
      properties:
        account_label:
          type: string
          maxLength: 255
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        stage_id:
          type: string
          description: Target stage as ULID or slug.
        probability_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Defaults to the stage's default probability if omitted.
        expected_close_date:
          type: string
          format: date
          nullable: true
        owner_user_id:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 2000

    DealUpdate:
      type: object
      minProperties: 1
      description: Partial update. Stage and Invoice link ids are excluded.
      properties:
        account_label:
          type: string
          maxLength: 255
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        probability_percent:
          type: integer
          minimum: 0
          maximum: 100
        expected_close_date:
          type: string
          format: date
          nullable: true
        owner_user_id:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 2000

    DealList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page; null when no more results.

    StageChangeRequest:
      type: object
      required: [to_stage_id]
      properties:
        to_stage_id:
          type: string
          description: Destination stage as ULID or slug.
        probability_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Optional override; otherwise the stage default applies.

    PipelineStage:
      type: object
      required:
        - id
        - organization_id
        - slug
        - label
        - sort_order
        - is_terminal
        - is_won
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        organization_id:
          type: string
          readOnly: true
        slug:
          type: string
          description: Stable key for client-side i18n labels (e.g. `proposal`).
          example: proposal
        label:
          type: string
          description: Server default display label; UI localizes by slug (ja/en).
        sort_order:
          type: integer
          description: Kanban column order (ascending).
        is_terminal:
          type: boolean
          description: True for won/lost.
        is_won:
          type: boolean
          description: True only for the won stage.

    StageHistoryEntry:
      type: object
      required:
        - id
        - deal_id
        - to_stage_id
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        deal_id:
          $ref: '#/components/schemas/Ulid'
        from_stage_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          nullable: true
          description: ULID; null when the deal was created at this stage.
        to_stage_id:
          $ref: '#/components/schemas/Ulid'
        actor_user_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    KanbanBoard:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/KanbanColumn'

    KanbanColumn:
      type: object
      required:
        - stage
        - deals
        - deal_count
        - total_cents
        - weighted_total_cents
      properties:
        stage:
          $ref: '#/components/schemas/PipelineStage'
        deals:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
        deal_count:
          type: integer
        total_cents:
          $ref: '#/components/schemas/AmountCents'
        weighted_total_cents:
          $ref: '#/components/schemas/AmountCents'

    ForecastSummary:
      type: object
      required:
        - month
        - open_deal_count
        - pipeline_total_cents
        - weighted_total_cents
        - by_stage
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-06'
        open_deal_count:
          type: integer
        pipeline_total_cents:
          allOf:
            - $ref: '#/components/schemas/AmountCents'
          description: Unweighted sum of amount_cents for in-month open deals.
        weighted_total_cents:
          allOf:
            - $ref: '#/components/schemas/AmountCents'
          description: Sum of amount_cents * probability_percent / 100 (approximate).
        by_stage:
          type: array
          items:
            $ref: '#/components/schemas/ForecastStageBucket'

    ForecastStageBucket:
      type: object
      required:
        - stage_id
        - slug
        - deal_count
        - total_cents
        - weighted_total_cents
      properties:
        stage_id:
          $ref: '#/components/schemas/Ulid'
        slug:
          type: string
        deal_count:
          type: integer
        total_cents:
          $ref: '#/components/schemas/AmountCents'
        weighted_total_cents:
          $ref: '#/components/schemas/AmountCents'

    InvoiceHandoffRequest:
      type: object
      description: |
        Optional handoff body. Empty body is valid; the deal's own fields drive
        the draft. Reserved for future optional hints (e.g. address fields,
        Phase 2). Deal sends draft resources only.
      properties:
        confirm:
          type: boolean
          description: Optional explicit confirmation flag for clients that send one.
          default: true

    InvoiceHandoffResult:
      type: object
      required:
        - deal_id
        - invoice_client_id
        - invoice_quote_id
        - handoff_at
      properties:
        deal_id:
          $ref: '#/components/schemas/Ulid'
        invoice_client_id:
          type: integer
          format: int64
          description: Draft client PK in NeNe Invoice.
        invoice_quote_id:
          type: integer
          format: int64
          description: Draft quote PK in NeNe Invoice.
        handoff_at:
          type: string
          format: date-time
        handoff_actor_user_id:
          type: string
          nullable: true

    Problem:
      type: object
      description: RFC 7807 Problem Details. type = https://nene-deal.dev/problems/{slug}
      properties:
        type:
          type: string
          format: uri
          example: https://nene-deal.dev/problems/validation-failed
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      additionalProperties: true
