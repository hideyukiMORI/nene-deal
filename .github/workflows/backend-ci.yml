name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    # `w3/**` は C5 W3 の drain wave 用。wave は前段の上に積む stacked PR に
    # なるため base が main にならず、branches が main だけだと CI が一切
    # 走らない（PR #187/#188 が "no checks reported" だった）。base 側の
    # ブランチ名で拾うことで、stacked でもゲートが効く。
    branches:
      - main
      - 'w3/**'

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # NENE2 (hideyukimori/nene2) is a tagged Packagist dependency (^1.8.2),
      # so a plain composer install resolves it — no sibling clone step needed.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Dependency-vulnerability gate. Kept as its own step rather than folded into
      # `composer check`, so the job log (and any cross-repo tooling that reads it)
      # can tell whether the audit ran at all. A check that leaves no trace cannot be
      # distinguished from a check that is missing.
      - name: composer audit
        run: composer audit --no-interaction

      - name: Prepare environment
        run: cp .env.example .env

      - name: Create var directory
        run: mkdir -p var

      # composer check = test (PHPUnit, SQLite :memory:) + analyse (PHPStan L8)
      # + cs (php-cs-fixer dry-run) + openapi + mcp + conformance (NENE2 linter).
      - name: Run checks
        run: composer check
